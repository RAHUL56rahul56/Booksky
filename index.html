<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" type="text/css" href="style.css">
   
</head>
<body>
    <div class="navbar">
        <h1>Booksy</h1>
    </div>
    <div class="container">
        <div class="book-container">
            <h2>Richds Dad poor Dad</h2>
            <h5>Robort</h5>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Cum cumque dolores suscipit soluta aperiam nulla enim minima fuga! Consequuntur quo corporis mollitia veniam eum nemo nisi doloribus, est molestias repudiandae.</p>
            <button onclick="deletebook(event)">Delete</button>
        </div>

      
    </div>
    <div class="popup-overlay"></div>
    <div class="popup-box">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="book-title-input">
            <input type="text" placeholder="Book Author" id="book-author-input">
            <textarea name="" placeholder="Short Description" id="book-description-input"></textarea>
            <button id="add-book">Add</button>
            <button id="cancel-popup">CANCEL</button>
        </form>

    </div>

    <button class="add-button" id="add-popup-button">+</button>
    <script src="script.js"></script>
</body>
</html>
